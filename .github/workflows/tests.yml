name: tests

# Fast-layer correctness tests. Runs on every push to main and every PR
# targeting main. Kept separate from docs-check.yml (which only verifies
# docs/cli.md is in sync) and from tests-e2e.yml (which exports real
# videos and is slower) so each failure signal stays independently
# legible in the PR UI.
#
# Dependency-free: covers `h2v bundle` (file-read-and-write only),
# `h2v export --dry-run` (the pre-browser pipeline), and `h2v review
# --no-open` (pure HTML generation). No `npm ci` step needed; everything
# uses Node stdlib.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
