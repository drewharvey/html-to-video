<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="h2v-duration" content="16.8">
<meta name="h2v-alpha" content="true">
<title>Clip 10 — Badges Only (Alpha)</title>
<style>
  :root {
    /* Vaadin dark background palette (brand.vaadin.com) */
    --blue: #056ff0;
    --cyan: #03f7ff;
    --violet: #7b5eff;
    --green: #0ADCC3;
    --teal: #22d3ee;
    --text: #f0f4f7;
    --muted: #ABADB3;
    --surface: rgba(255,255,255,0.05);
    --border-base: rgba(255,255,255,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent !important; }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }

  .trust { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .tb {
    padding: 12px 20px;
    background: var(--surface);
    border: 1.5px solid var(--border-base);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    display: flex; align-items: center; gap: 10px;
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .tb.visible { opacity: 1; transform: translateY(0); }

  .tb .icon { width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .tb .icon svg { width: 18px; height: 18px; }

  .tb.blue { border-color: rgba(5,111,240,0.35); color: #3BADFF; }
  .tb.blue .icon svg { stroke: #3BADFF; fill: none; }

  .tb.violet { border-color: rgba(123,94,255,0.3); color: #D39AF7; }
  .tb.violet .icon svg { stroke: #D39AF7; fill: none; }

  .tb.green { border-color: rgba(10,220,195,0.3); color: #0ADCC3; }
  .tb.green .icon svg { stroke: #0ADCC3; fill: none; }

  .tb.teal { border-color: rgba(34,211,238,0.3); color: #7DCFFF; }
  .tb.teal .icon svg { stroke: #7DCFFF; fill: none; }
</style>
</head>
<body>

<div class="trust">

  <div class="tb blue" id="t1">
    <div class="icon"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </svg></div>
    Open Source
  </div>

  <div class="tb violet" id="t2">
    <div class="icon"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
    </svg></div>
    25 Years in Production
  </div>

  <div class="tb green" id="t3">
    <div class="icon"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg></div>
    Security
  </div>

  <div class="tb teal" id="t4">
    <div class="icon"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><path d="M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z"/><line x1="2" y1="12" x2="8" y2="12"/><line x1="16" y1="12" x2="22" y2="12"/>
    </svg></div>
    WCAG 2.1 AA
  </div>

  <div class="tb blue" id="t5">
    <div class="icon"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg></div>
    15-Year LTS
  </div>

</div>

<script>
setTimeout(function(){ document.getElementById('t1').classList.add('visible'); }, 3000);
setTimeout(function(){ document.getElementById('t2').classList.add('visible'); }, 5500);
setTimeout(function(){ document.getElementById('t3').classList.add('visible'); }, 9500);
setTimeout(function(){ document.getElementById('t4').classList.add('visible'); }, 11500);
setTimeout(function(){ document.getElementById('t5').classList.add('visible'); }, 14500);
</script>
</body>
</html>
